[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whitewater-client"
version = "0.1.0.dev0"
description = "Whitewater SDK for Python: Admin (WCL), Writer, Reader, and Subscription member clients over the whitewater-protocol wire contract"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/whitewater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
